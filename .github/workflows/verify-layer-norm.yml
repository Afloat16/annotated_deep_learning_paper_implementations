name: Verify LayerNorm numerical regression

permissions:
  contents: read

on:
  workflow_dispatch:
  push:
    branches:
      - verify/layer-norm

jobs:
  cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CPU test dependencies
        run: |
          python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install pytest
      - name: Run complete native affected tests
        run: python -m pytest tests/test_layer_norm.py -q
      - name: Confirm the original implementation fails the regressions
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess
          path = Path('labml_nn/normalization/layer_norm/__init__.py')
          patched = path.read_bytes()
          try:
              original = subprocess.check_output([
                  'git', 'show',
                  '33ab02281c2b928e6b32792909cc79cbdcfe1d6a:labml_nn/normalization/layer_norm/__init__.py',
              ])
              path.write_bytes(original)
              result = subprocess.run([
                  'python', '-m', 'pytest', 'tests/test_layer_norm.py', '-q',
              ], text=True, capture_output=True)
              print(result.stdout)
              print(result.stderr)
              assert result.returncode == 1
              assert 'FAILED tests/test_layer_norm.py::test_layer_norm_is_stable_under_common_offset[10000.0-float32]' in result.stdout
              assert 'ERROR collecting' not in result.stdout
          finally:
              path.write_bytes(patched)
          PY
